<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comidas Argentinas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <input
        type="search"
        id="buscador"
        placeholder="Buscar por nombre, provincia o categoria"
      />
      <select id="filtroCategoria">
        <option value="">Todas las categorias</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Guiso">Guiso</option>
        <option value="Frito">Frito</option>
      </select>
      <select id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Cordoba">Cordoba</option>
        <option value="Entre Rios">Entre Rios</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Salta">Salta</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Tucuman">Tucuman</option>
      </select>
    </header>

    <main class="comida-container" id="comidaContainer">
      <!-- Contenido Dinamico -->
    </main>

    <section class="addFood">
      <form id="agregarComida">
        <h2>Agregar comida</h2>
        <label>Nombre de comida</label>
        <input
          type="text"
          name="nombre"
          placeholder="Nombre del comida"
          required
        />
        <label>Tipo de comida</label>
        <input type="text" name="categoria" placeholder="tipo de comida" />

        <label>provincia de la comida</label>
        <input
          type="text"
          name="provincia"
          placeholder="provincia del comida"
        />
        <label>ingrendientes de la comida</label>
        <input
          type="text"
          name="ingredientes"
          placeholder="ingredientes de la comida"
        />
        <button type="submit" id="boton-agregar">Agregar comida</button>
      </form>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
